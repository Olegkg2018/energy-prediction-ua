services:
  energy-predict:
    build: .
    container_name: energy-prediction-ua
    ports:
      - "5000:5000"
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-demo_key}
      - ENTSOE_API_KEY=${ENTSOE_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./model:/app/model
    restart: unless-stopped
