<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Energy Predictor UA{% endblock %}</title>
    <script src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
    (function() {
        var theme = localStorage.getItem('theme') || 'system';
        document.documentElement.setAttribute('data-theme', theme);
    })();
    </script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">⚡ EnergyPredict UA</a>
            <div class="nav-links">
                <a href="/">Дашборд</a>
                <a href="/predict">Прогноз</a>
                <a href="/generate-form">Генерація</a>
                <a href="/about">Про проект</a>
            </div>
            <div class="theme-switcher">
                <button class="theme-btn" data-theme-val="dark" onclick="setTheme('dark')" title="Темна тема">🌙</button>
                <button class="theme-btn" data-theme-val="light" onclick="setTheme('light')" title="Світла тема">☀️</button>
                <button class="theme-btn" data-theme-val="system" onclick="setTheme('system')" title="Системна тема">💻</button>
            </div>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <div class="container">
            <p>Energy Prediction UA &copy; 2025 | Дані: ОРЕЕ, OpenWeather | Координати: 49.53, 30.40</p>
        </div>
    </footer>
    <script>
    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        document.querySelectorAll('.theme-btn').forEach(function(b) {
            b.classList.toggle('active', b.getAttribute('data-theme-val') === theme);
        });
        var isLight = getComputedStyle(document.documentElement).getPropertyValue('--bg-card').trim() === '#ffffff';
        var paper = isLight ? '#ffffff' : '#141834';
        var plotBg = isLight ? '#f8f9fa' : '#1a1f42';
        var fontColor = isLight ? '#1a1a2e' : '#e0e0e0';
        document.querySelectorAll('.js-plotly-plot').forEach(function(el) {
            Plotly.relayout(el, {
                'paper_bgcolor': paper,
                'plot_bgcolor': plotBg,
                'font.color': fontColor,
                'xaxis.gridcolor': isLight ? '#ddd' : '#2a2f52',
                'yaxis.gridcolor': isLight ? '#ddd' : '#2a2f52',
            });
        });
    }
    window.addEventListener('load', function() {
        var theme = localStorage.getItem('theme') || 'system';
        document.querySelectorAll('.theme-btn').forEach(function(b) {
            b.classList.toggle('active', b.getAttribute('data-theme-val') === theme);
        });
        setTimeout(function() { setTheme(theme); }, 100);
    });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
